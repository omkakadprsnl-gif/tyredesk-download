name: Publish verified signed TyreDesk 1.3.10
on:
  push:
    branches: [tyredesk-140-publish]
    paths: ['.github/workflows/publish-tyredesk-140.yml']
permissions:
  contents: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify signed APK from passing Android CI
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-a3d0-8208-b616-b2404c518a1f/raw?se=2026-11-22T23%3A51%3A18Z&sp=r&sv=2026-06-06&sr=b&scid=e9708656-681c-5d47-a6f2-00f296cc48a6&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T01%3A22%3A20Z&ske=2026-11-23T01%3A22%3A20Z&sks=b&skv=2026-06-06&sig=xXuDWSwaGmQRXMhvkAbZCx5e7FyxQc%2BoMz6RvQSy5pU%3D'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 "$ARTIFACT_URL" -o "$RUNNER_TEMP/tyredesk-140.zip"
          unzip -t "$RUNNER_TEMP/tyredesk-140.zip" >/dev/null
          unzip -p "$RUNNER_TEMP/tyredesk-140.zip" TyreDesk.apk > "$RUNNER_TEMP/TyreDesk-1.3.10.apk"
          echo '30ec108e44da19c2938bad9b0e9f8e958e2c6c25b18314304ac094a8cc3b2188  '"$RUNNER_TEMP/TyreDesk-1.3.10.apk" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/tyredesk-140.zip" SHA256.txt | grep -q '30ec108e44da19c2938bad9b0e9f8e958e2c6c25b18314304ac094a8cc3b2188'
      - name: Checkout tested and merged public source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate certificate continuity, version, permissions and bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/TyreDesk-1.3.10.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OLD_CERT=$("$SIGNER" verify --print-certs docs/TyreDesk.apk | grep -m1 'Signer #1 certificate SHA-256 digest:')
          NEW_CERT=$("$SIGNER" verify --print-certs "$APK" | grep -m1 'Signer #1 certificate SHA-256 digest:')
          test "$OLD_CERT" = "$NEW_CERT"
          "$SIGNER" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/tyredesk140-package.txt"
          grep -q "name='com.tyredesk.offline'" "$RUNNER_TEMP/tyredesk140-package.txt"
          grep -q "versionCode='24'" "$RUNNER_TEMP/tyredesk140-package.txt"
          grep -q "versionName='1.3.10'" "$RUNNER_TEMP/tyredesk140-package.txt"
          ! grep -q application-debuggable "$RUNNER_TEMP/tyredesk140-package.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > "$RUNNER_TEMP/tyredesk140-permissions.txt"
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/tyredesk140-permissions.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/tyredesk140-manifest.txt"
          ! grep -q 'FileProvider' "$RUNNER_TEMP/tyredesk140-manifest.txt"
          unzip -p "$APK" assets/www/src/tyres.js | grep -q 'stockKeyFields'
          unzip -p "$APK" assets/www/src/main.js | grep -q 'Separate tyre variants'
          unzip -p "$APK" assets/www/src/db.js | grep -q 'Stock-identifying tyre fields cannot change'
          unzip -p "$APK" assets/www/src/updates.js | grep -q '1.3.10'
          grep -q "WEB_VERSION='1.3.10'" docs/app/src/updates.mjs
          grep -q 'tyredesk-pwa-web-v1.3.10' docs/app/sw.js
          grep -q 'Custom tyre classification' docs/RELEASE-NOTES.md
          grep -q '"version": "1.3.9"' docs/release.json
          grep -q "Version 1.3.9" docs/index.html
          ! unzip -p "$APK" assets/www/src/main.js | grep -q 'Import supplier PDF'
      - name: Publish exact verified signed APK and release metadata
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/TyreDesk-1.3.10.apk" docs/TyreDesk.apk
          printf '30ec108e44da19c2938bad9b0e9f8e958e2c6c25b18314304ac094a8cc3b2188  TyreDesk.apk\n' > docs/TyreDesk.apk.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/release.json')
          data=json.loads(p.read_text(encoding='utf8'))
          assert data['version']=='1.3.9' and data['androidVersionCode']==23,'Release advanced; abort'
          data.update({
            'version':'1.3.10',
            'webVersion':'1.3.10',
            'androidVersionCode':24,
            'apkSha256':'30ec108e44da19c2938bad9b0e9f8e958e2c6c25b18314304ac094a8cc3b2188',
            'appCommit':'ce4943a6ce74a99f70b833bd2988a572d017e13f',
            'webCommit':'ce4943a6ce74a99f70b833bd2988a572d017e13f',
            'androidBuildCommit':'df2ee48908d4cbb60c4cfa3ebd85c99ea7983200',
            'releaseDate':'2026-11-23'
          })
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf8')
          site=Path('docs/index.html')
          original=site.read_text(encoding='utf8')
          assert original.count('Version 1.3.9')==1
          site.write_text(original.replace('Version 1.3.9','Version 1.3.10'),encoding='utf8')
          PY
          git config user.name 'TyreDesk Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TyreDesk.apk docs/TyreDesk.apk.sha256 docs/release.json docs/index.html
          git commit -m 'Publish signed TyreDesk v1.3.10 with safe tyre classification'
          git push origin HEAD:main
      - name: Report publication outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          gh api "repos/${{ github.repository }}/issues/2/comments" -f body="TyreDesk v1.3.10 publication: $STATUS. Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
