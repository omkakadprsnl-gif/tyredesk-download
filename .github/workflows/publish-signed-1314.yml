name: Publish verified TyreDesk 1.3.14 signed keyboard fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-signed-1314.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned signed customer artifact
        env:
          RELEASE_ZIP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6c68-81f4-bbfa-05edeed98be2/raw?se=2026-11-23T09%3A32%3A10Z&sp=r&sv=2026-06-06&sr=b&scid=3c1bab34-781b-5e79-a8a2-77c7eb18962b&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T04%3A03%3A00Z&ske=2026-11-24T04%3A03%3A00Z&sks=b&skv=2026-06-06&sig=UrPgS8ns1PHZnmC2J5CWyr0W9QT8G5s4TAbAHRgKYJY%3D'
          EXPECTED_ZIP_SHA256: '386b8d9513fdf39cbc46a882272049d83dd690979bdbcec3ad0074bb2a239a19'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 "$RELEASE_ZIP_URL" -o /tmp/tyredesk-1.3.14.zip
          printf '%s  /tmp/tyredesk-1.3.14.zip\n' "$EXPECTED_ZIP_SHA256" | sha256sum -c -
          unzip -t /tmp/tyredesk-1.3.14.zip >/dev/null
          unzip -p /tmp/tyredesk-1.3.14.zip TyreDesk.apk > docs/TyreDesk.apk
          unzip -t docs/TyreDesk.apk >/dev/null
          unzip -p /tmp/tyredesk-1.3.14.zip package-info.txt | grep -F "versionCode='28'"
          unzip -p /tmp/tyredesk-1.3.14.zip package-info.txt | grep -F "versionName='1.3.14'"
      - name: Validate signed app and update published metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          base=Path('docs')
          apk=base/'TyreDesk.apk'
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='b16bbaaaec226ebb053d2a154c968e79d914525e6a068258e21c77c8ae5ed5f6'
          assert sha==expected,'unexpected signed APK hash'
          with zipfile.ZipFile(apk) as archive:
              main=archive.read('assets/www/src/main.js').decode('utf8')
              styles=archive.read('assets/www/styles.css').decode('utf8')
              updates=archive.read('assets/www/src/updates.js').decode('utf8')
              assert 'Open Download Page' in main and 'Check if a newer TyreDesk version is ready' in main
              assert 'grid-template-rows:auto minmax(0,1fr) auto!important' in styles
              assert 'max-height:35%!important' not in styles
              assert "WEB_VERSION='1.3.14'" in updates and 'openUpdatePage' in updates
          path=base/'release.json'
          release=json.loads(path.read_text())
          assert release['version']=='1.3.13' and release['androidVersionCode']==27,'unexpected current release'
          release.update({
              'version':'1.3.14',
              'webVersion':'1.3.14',
              'androidVersionCode':28,
              'apkSha256':sha,
              'appCommit':'aa5739b764844af72e28e0b14fb8663766a647db',
              'webCommit':'aa5739b764844af72e28e0b14fb8663766a647db',
              'androidBuildCommit':'6447f6602db920b0aebecf7b492798d60d6e3cb5',
              'releaseDate':'2026-11-23',
          })
          path.write_text(json.dumps(release,indent=2)+'\n')
          (base/'TyreDesk.apk.sha256').write_text(sha+'  TyreDesk.apk\n')
          index=base/'index.html'
          txt=index.read_text()
          assert txt.count('Version 1.3.13')==1
          index.write_text(txt.replace('Version 1.3.13','Version 1.3.14'))
          notes=base/'RELEASE-NOTES.md'
          notes.write_text('''# TyreDesk 1.3.14 — Keyboard-safe tyre purchase, reminder and expense dialogs

          Fixes the Android keyboard issue visible in the 1.3.13 release: the input form was squeezed into a small strip near the header while Save/Cancel buttons appeared too high and a large blank area remained beneath them.

          Phone-sized dialogs now use a three-row grid with a dedicated scrollable form and footer. On keyboard resize, the form occupies the available space and the footer remains anchored inside the visible dialog. Regression tests cover narrow Android viewport sizes, tyre purchase fields and reminder-style dialogs.

          Install the same-signed APK **over** TyreDesk 1.3.13. Never uninstall or clear the application storage to upgrade. The app will still show Update Available and open the official download page. Actual Samsung keyboard behavior should be confirmed on the affected phone before closing the issue.

          '''+notes.read_text())
          print('Release verified:',sha)
          PY
      - name: Commit signed release for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TyreDesk.apk docs/TyreDesk.apk.sha256 docs/release.json docs/index.html docs/RELEASE-NOTES.md
          git diff --cached --quiet && exit 1
          git commit -m "Publish signed TyreDesk 1.3.14 keyboard-safe modal update"
          git push origin HEAD:main
