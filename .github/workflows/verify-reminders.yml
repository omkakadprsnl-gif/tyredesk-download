name: Verify TyreDesk features and offline app
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, tyredesk-1.3.0-release, commercial-audit-20261122, billing-handover, fix-commercial-blockers, fix-138-signin]
    paths:
      - 'docs/app/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'package*.json'
      - '.github/workflows/verify-reminders.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned verification dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript module syntax
        run: |
          node --check docs/app/src/db.mjs
          node --check docs/app/src/main.mjs
          node --check docs/app/src/i18n.mjs
          node --check docs/app/src/pwa-backup.mjs
          node --check docs/app/sw.js
      - name: Check reminders, ledger, stock and backups
        run: npm test
      - name: Test shop-defined tyre stock keys and legacy history
        run: node tests/tyre-classification.test.mjs
      - name: Test immutable shop-defined identifiers and Monday backup reminders
        run: node tests/shop-fields.test.mjs
      - name: Verify service invoice charges have no quantity label
        run: node tests/service-no-quantity.test.mjs
      - name: Validate permanent identifier enforcement in PostgreSQL
        run: node tests/shop-fields-db.test.mjs
      - name: Verify financial edge cases and database authorization
        run: npm run test:audit
      - name: Validate SQL migration for custom tyre variant identities
        run: node tests/tyre-classification-db.test.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check mobile billing and offline inventory
        run: npm run test:browser
      - name: Check desktop invoice actions and offline flows
        run: npm run test:desktop
      - name: Check two-device shop sync and recovery
        run: npm run test:cloud
      - name: Verify sign-in and setup with an update available
        run: node tests/signin-layout.test.mjs
      - name: Verify inventory modes and responsive billing
        run: node tests/mobile-inventory.test.mjs
      - name: Test custom tyre classification and billing on narrow screens
        run: node tests/tyre-classification.browser.test.mjs
      - name: Verify mobile keyboard-safe dialogs and configurable tyre purchasing
        run: node tests/shop-fields.browser.test.mjs

